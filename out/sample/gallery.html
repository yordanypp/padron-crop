<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padrón Crop - Visual QA Gallery</title>
<style>
  :root {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --ok: #22c55e;
    --warn: #eab308;
    --fail: #ef4444;
    --noop: #38bdf8;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 1.6rem; margin-bottom: 8px; font-weight: 700; }
  .stats-bar {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin: 16px 0;
  }
  .stat-pill {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 0.9rem;
  }
  .stat-pill b { font-size: 1.1rem; }
  .filters {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .filter-btn {
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: #3b82f6;
    border-color: #3b82f6;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card-header {
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .badge {
    font-size: 0.75rem;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .badge-ok { background: rgba(34,197,94,0.2); color: var(--ok); border: 1px solid var(--ok); }
  .badge-warn { background: rgba(234,179,8,0.2); color: var(--warn); border: 1px solid var(--warn); }
  .badge-fail { background: rgba(239,68,68,0.2); color: var(--fail); border: 1px solid var(--fail); }
  .badge-noop { background: rgba(56,189,248,0.2); color: var(--noop); border: 1px solid var(--noop); }
  .card-title {
    font-size: 0.85rem;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .img-container {
    height: 260px;
    background: #020617;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .img-container img {
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;
  }
  .no-img {
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  .card-body {
    padding: 12px;
    font-size: 0.8rem;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: #182234;
  }
  .card-body .row {
    display: flex;
    justify-content: space-between;
    color: var(--text-muted);
  }
  .card-body .row b {
    color: var(--text);
  }
  .reason {
    margin-top: 8px;
    padding: 6px;
    background: rgba(239,68,68,0.15);
    border-left: 3px solid var(--fail);
    border-radius: 4px;
    color: #fca5a5;
    font-size: 0.75rem;
  }
</style>
</head>
<body>
<header>
  <h1>Padrón Crop &mdash; Visual QA Gallery</h1>
  <div class="stats-bar">
    <div class="stat-pill">Total: <b>1</b></div>
    <div class="stat-pill" style="color:var(--ok)">Ok: <b>1</b></div>
    <div class="stat-pill" style="color:var(--warn)">Quarantine: <b>0</b></div>
    <div class="stat-pill" style="color:var(--fail)">Failed: <b>0</b></div>
    <div class="stat-pill" style="color:var(--noop)">Noop: <b>0</b></div>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all')">Todos (1)</button>
    <button class="filter-btn" onclick="setFilter('ok')">Ok (1)</button>
    <button class="filter-btn" onclick="setFilter('quarantine')">Quarantine (0)</button>
    <button class="filter-btn" onclick="setFilter('failed')">Failed (0)</button>
  </div>
</header>

<div class="grid" id="cardGrid">

        <div class="card" data-status="ok">
            <div class="card-header">
                <span class="badge badge-ok">OK</span>
                <span class="card-title" title="0aaa2b82-4607-4f53-8a28-ccafa017104d.jpg">0aaa2b82-4607-4f53-8a28-ccafa017104d</span>
            </div>
            <div class="img-container">
                <img src="anchor_crop.jpg" loading="lazy" alt="Cropped preview" />
            </div>
            <div class="card-body">
                <div class="row"><span>Method:</span><b>projection+glyphs</b></div>
                <div class="row"><span>Confidence:</span><b>0.90</b></div>
                <div class="row"><span>Original:</span><b>960x1280</b></div>
                <div class="row"><span>Crop Box:</span><b>0,0,960,1004</b></div>
                <div class="row"><span>Face / Chin:</span><b>No / Safe</b></div>
                <div class="row"><span>Skew:</span><b>0.0&deg;</b></div>
                <div class="row"><span>Time:</span><b>158 ms</b></div>
                
            </div>
        </div>
        
</div>

<script>
function setFilter(st) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.card').forEach(c => {
    if (st === 'all' || c.getAttribute('data-status') === st) {
      c.style.display = 'flex';
    } else {
      c.style.display = 'none';
    }
  });
}
</script>
</body>
</html>
